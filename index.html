<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>製造実績入力</title>

<style>
body{
    font-family: "Yu Gothic UI",sans-serif;
    background:#f4f6f8;
    margin:20px;
}

.container{
    background:#fff;
    border-radius:8px;
    padding:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

h2{
    margin-top:0;
}

.tabs{
    display:flex;
    border-bottom:2px solid #ddd;
    margin-bottom:20px;
}

.tab{
    padding:12px 25px;
    background:#eee;
    cursor:pointer;
    margin-right:5px;
}

.tab.active{
    background:#1565C0;
    color:white;
}

.form{
    display:grid;
    grid-template-columns:150px 220px 150px 220px;
    gap:10px;
    margin-bottom:20px;
}

input,select{
    padding:8px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1565C0;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:8px;
}

td input{
    width:80px;
}

tfoot td{
    font-weight:bold;
    background:#f5f5f5;
}

.button-area{
    margin-top:20px;
    text-align:right;
}

button{
    padding:10px 20px;
    border:none;
    color:white;
    cursor:pointer;
    border-radius:5px;
}

.save{
    background:#1976D2;
}

.add{
    background:#43A047;
}

</style>

</head>

<body>

<div class="container">

<h2>製造実績入力</h2>

<div class="tabs">
    <div class="tab active">実績入力</div>
    <div class="tab">履歴照会</div>
    <div class="tab">集計・分析</div>
</div>

<div class="form">

<label>日付</label>
<input type="date">

<label>製造ライン</label>
<select>
<option>ライン1</option>
<option>ライン2</option>
</select>

<label>作業者</label>
<select>
<option>山田太郎</option>
<option>佐藤次郎</option>
</select>

<label>シフト</label>
<select>
<option>日勤</option>
<option>夜勤</option>
</select>

</div>

<table>

<thead>
<tr>
<th>製品コード</th>
<th>製品名</th>
<th>計画数</th>
<th>実績数</th>
<th>良品</th>
<th>不良</th>
<th>稼働時間</th>
<th>停止時間</th>
</tr>
</thead>

<tbody>

<tr>
<td>A-123</td>
<td>製品A</td>
<td>500</td>
<td><input value="350"></td>
<td><input value="340"></td>
<td><input value="10"></td>
<td><input value="480"></td>
<td><input value="30"></td>
</tr>

<tr>
<td>B-456</td>
<td>製品B</td>
<td>300</td>
<td><input value="280"></td>
<td><input value="275"></td>
<td><input value="5"></td>
<td><input value="460"></td>
<td><input value="40"></td>
</tr>

</tbody>

<tfoot>
<tr>
<td colspan="3">合計</td>
<td>630</td>
<td>615</td>
<td>15</td>
<td>940</td>
<td>70</td>
</tr>
</tfoot>

</table>

<div style="margin-top:15px;">
<button class="add">＋ 行追加</button>
</div>

<div class="button-area">
<button class="save">保存</button>
</div>

</div>

</body>
</html>
