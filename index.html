<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>QRコード読み取りデモ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            width: min(100% - 32px, 600px);
            margin: 0 auto;
            padding: 24px 0 40px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px;
        }

        .description {
            color: #666;
            margin-bottom: 20px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #111;
            border-radius: 16px;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* QR読み取り枠 */
        .scan-frame {
            position: absolute;
            width: 55%;
            aspect-ratio: 1;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid white;
            border-radius: 12px;
            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.35);
        }

        .scan-line {
            position: absolute;
            left: 5%;
            right: 5%;
            top: 50%;
            height: 2px;
            background: #00e676;
            animation: scan 2s infinite ease-in-out;
        }

        @keyframes scan {
            0% {
                transform: translateY(-80px);
            }

            50% {
                transform: translateY(80px);
            }

            100% {
                transform: translateY(-80px);
            }
        }

        .status {
            margin-top: 16px;
            padding: 14px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            min-height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #startButton {
            background: #1976d2;
            color: white;
        }

        #stopButton {
            background: #ddd;
            color: #333;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 24px;
            padding: 20px;
            background: white;
            border-radius: 12px;
        }

        .result-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        #resultText {
            min-height: 24px;
            padding: 12px;
            background: #f1f3f5;
            border-radius: 8px;
            word-break: break-all;
        }

        .error {
            color: #d32f2f;
        }

        .success {
            color: #2e7d32;
            font-weight: bold;
        }

        .info {
            margin-top: 24px;
            padding: 16px;
            background: #e3f2fd;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.7;
        }

        /* canvasは解析用なので非表示 */
        #canvas {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                width: min(100% - 20px, 600px);
                padding-top: 16px;
            }

            h1 {
                font-size: 21px;
            }

            .camera-container {
                border-radius: 12px;
            }

            .scan-frame {
                width: 65%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>QRコード読み取り</h1>

    <div class="description">
        カメラにQRコードをかざしてください
    </div>

    <!-- カメラ -->
    <div class="camera-container">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <div class="scan-frame">
            <div class="scan-line"></div>
        </div>

    </div>

    <!-- ステータス -->
    <div id="status" class="status">
        「カメラ開始」を押してください
    </div>

    <!-- ボタン -->
    <div class="buttons">

        <button id="startButton">
            カメラ開始
        </button>

        <button id="stopButton" disabled>
            停止
        </button>

    </div>

    <!-- 読み取り結果 -->
    <div class="result">

        <div class="result-title">
            読み取り結果
        </div>

        <div id="resultText">
            まだ読み取っていません
        </div>

    </div>

    <div class="info">
        <strong>対応イメージ</strong><br>
        Android / Chrome<br>
        iPad / Safari<br>
        iPhone / Safari<br><br>

        ※ カメラを使用するため、HTTPS環境での利用を推奨します。
    </div>

</div>

<canvas id="canvas"></canvas>


<script>

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    const status = document.getElementById("status");
    const resultText = document.getElementById("resultText");

    let stream = null;
    let scanning = false;
    let animationId = null;


    /*
     * カメラ開始
     */
    async function startCamera() {

        try {

            status.textContent = "カメラを起動しています...";
            status.className = "status";

            /*
             * 背面カメラを優先
             *
             * Android / iPadでQRを読む場合、
             * environment が重要
             */
            stream = await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                },

                audio: false
            });


            video.srcObject = stream;

            await video.play();

            scanning = true;

            startButton.disabled = true;
            stopButton.disabled = false;

            status.textContent =
                "QRコードをカメラにかざしてください";

            scanQRCode();

        }
        catch (error) {

            console.error(error);

            status.textContent =
                "カメラを起動できませんでした";

            status.className =
                "status error";

            if (error.name === "NotAllowedError") {

                status.textContent =
                    "カメラの使用が拒否されています。ブラウザの設定を確認してください。";

            }
            else if (error.name === "NotFoundError") {

                status.textContent =
                    "カメラが見つかりませんでした。";

            }
            else {

                status.textContent =
                    "カメラを利用できませんでした: "
                    + error.message;
            }
        }
    }


    /*
     * QRコード解析
     *
     * BarcodeDetector APIを使用
     */
    async function scanQRCode() {

        if (!scanning) {
            return;
        }


        /*
         * BarcodeDetectorが利用できるか確認
         */
        if (!("BarcodeDetector" in window)) {

            status.textContent =
                "このブラウザはBarcodeDetector APIに対応していません。";

            status.className =
                "status error";

            return;
        }


        try {

            const detector =
                new BarcodeDetector({
                    formats: ["qr_code"]
                });


            /*
             * カメラ映像をcanvasへコピー
             */
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * QRコード検出
             */
            const codes =
                await detector.detect(canvas);


            if (codes.length > 0) {

                const value =
                    codes[0].rawValue;

                handleQRCode(value);

                return;
            }

        }
        catch (error) {

            console.error(
                "QR解析エラー:",
                error
            );
        }


        /*
         * 次のフレームで再度解析
         */
        animationId =
            requestAnimationFrame(scanQRCode);
    }


    /*
     * QRコード読み取り成功
     */
    function handleQRCode(value) {

        resultText.textContent = value;

        status.textContent =
            "QRコードを読み取りました！";

        status.className =
            "status success";


        /*
         * 連続読み取りを停止
         */
        scanning = false;

        if (animationId) {

            cancelAnimationFrame(animationId);

            animationId = null;
        }


        /*
         * バイブレーション
         *
         * Androidなど対応端末では
         * 読み取り時に振動する
         */
        if ("vibrate" in navigator) {

            navigator.vibrate(200);
        }
    }


    /*
     * カメラ停止
     */
    function stopCamera() {

        scanning = false;


        if (animationId) {

            cancelAnimationFrame(animationId);

            animationId = null;
        }


        if (stream) {

            stream
                .getTracks()
                .forEach(track => track.stop());

            stream = null;
        }


        video.srcObject = null;

        startButton.disabled = false;
        stopButton.disabled = true;

        status.textContent =
            "カメラを停止しました";

        status.className =
            "status";
    }


    /*
     * ボタンイベント
     */
    startButton.addEventListener(
        "click",
        startCamera
    );

    stopButton.addEventListener(
        "click",
        stopCamera
    );


    /*
     * ページを離れるときに
     * カメラを停止
     */
    window.addEventListener(
        "pagehide",
        stopCamera
    );

</script>

</body>
</html>
