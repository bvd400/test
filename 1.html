<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>製造実績登録</title>
<style>
body{
    font-family:sans-serif;
    background:#f2f5f8;
    margin:0;
}

.header{
    background:#0067c5;
    color:white;
    padding:20px;
    font-size:22px;
}

.card{
    background:white;
    margin:15px;
    padding:20px;
    border-radius:15px;
}

.label{
    color:#666;
    font-size:14px;
}

.value{
    font-size:20px;
    font-weight:bold;
}

.input{
    width:100%;
    font-size:28px;
    padding:15px;
    text-align:center;
}

button{
    width:100%;
    padding:20px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:22px;
    background:#0067c5;
    color:white;
}
</style>
</head>

<body>

<div class="header">
製造実績登録
</div>

<div class="card">
<div class="label">作業者</div>
<div class="value">山田 太郎</div>

<br>

<div class="label">設備</div>
<div class="value">NC旋盤 A-01</div>

<br>

<div class="label">品番</div>
<div class="value">ABC-12345</div>
</div>


<div class="card">

<div class="label">完成数量</div>

<input class="input" value="120">

<div class="label">不良数量</div>

<input class="input" value="2">


<button>
登録する
</button>

</div>

</body>
</html>
