<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>製造実績登録</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
    "Noto Sans JP",
    sans-serif;
    background:#f3f5f7;
}


.header{
    background:#0067c5;
    color:white;
    padding:18px;
    font-size:22px;
    font-weight:bold;
}


.container{
    padding:15px;
}


.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 2px 5px #ccc;
}


.title{
    font-size:14px;
    color:#777;
}


.value{
    font-size:22px;
    font-weight:bold;
    margin-top:5px;
}


.qr{

    height:150px;
    border:3px dashed #0067c5;
    border-radius:15px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:22px;
    color:#0067c5;
    font-weight:bold;

}


button{

    width:100%;
    padding:22px;

    border:none;
    border-radius:15px;

    font-size:24px;
    font-weight:bold;

    background:#008c45;
    color:white;

}


.input{

    width:100%;
    padding:15px;

    font-size:30px;
    text-align:center;

    border-radius:10px;
    border:1px solid #aaa;

}


.row{

    display:flex;
    gap:10px;

}


.row .card{

    flex:1;

}


.status{

    background:#e7f7ed;
    color:#008c45;

    padding:10px;

    border-radius:10px;

    text-align:center;

    font-size:20px;

}


</style>

</head>


<body>


<div class="header">

🏭 製造実績登録

</div>



<div class="container">



<div class="card">


<div class="qr">

📷 QRコード読取

</div>


</div>



<div class="card">

<div class="title">
製造指示番号
</div>

<div class="value">
WO-20260807-001
</div>


<br>


<div class="title">
品番
</div>

<div class="value">
ABC-12345
</div>


<br>


<div class="title">
ロット番号
</div>

<div class="value">
LOT-00025
</div>


</div>




<div class="status">

設備状態：稼働中

</div>




<div class="card">


<div class="title">
完成数量
</div>


<input class="input"
value="120">



<br><br>


<div class="title">
不良数量
</div>


<input class="input"
value="2">


</div>




<button>

登録する

</button>



</div>



</body>
</html>
